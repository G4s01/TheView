<!DOCTYPE html>
<html>
<head>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 16px;
    width: 800px;
  }
  .card { border: 1px solid black; padding: 10px; }
  .row-2 { grid-row: span 2; height: 300px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">Short</div>
    <div class="card row-2">Row span 2 but tall</div>
  </div>
</body>
</html>
