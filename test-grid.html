<!DOCTYPE html>
<html>
<head>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 16px;
    width: 800px;
  }
  .card { border: 1px solid black; padding: 10px; }
  .row-2 { grid-row: span 2; }
  .col-2 { grid-column: span 2; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">Short</div>
    <div class="card">Very very very long content<br>line 2<br>line 3<br>line 4</div>
    <div class="card row-2">Row span 2<br>more<br>more</div>
    <div class="card col-2">Col span 2</div>
  </div>
</body>
</html>
